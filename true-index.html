<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShinyAkira</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: LaborUnion;
  background-color: #e8e8e8;
  overflow-x: hidden;
}

/* Hero */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  padding: 3rem 5rem 6rem 6rem; 
  position: relative;
}

.hero a1 {
  font-size: 5rem;
  margin-bottom: 1rem;
}

.a2-text {
  transition: opacity 0.5s ease;
  font-size:2rem; 
}
.a2-text.fade-out {
  opacity: 0;
}
.a2-scroll-text {
  font-family: 'Futura';
}

/* 其他字体样式 */
.hero p {
  font-size: 1rem;
  line-height: 1.5;
}

.banner{
  position: relative;
  display: inline-block;
  color: #000;
  text-decoration: none;
  padding-bottom: 2px;
}

.banner:hover{
    color: #0008ff;
}
.banner::after {
  content:'';
  position: absolute;
  left: 0;
  bottom: 0;
  width:100%;
  height:3px;
  background-color:#0008ff;
  transform:scale(0,1);
  transform-origin:left;
  transition: 0.3s;
}
.banner:hover::after {
  transform: scaleX(1);
}

.canner {
  font-style: italic;
  color: #000;
  text-decoration: underline;              /* 开启下划线 */
  text-decoration-thickness: 3px;          /* 下划线的粗细 */
  text-underline-offset: 1.5px;              /* 控制与文字的距离（0 就是紧贴） */
  text-decoration-color: #000;             /* 默认黑色下划线 */
  transition: text-decoration-color 0.3s;
}

.canner:hover {
  text-decoration-color: #0008ff;          /* hover 时下划线变蓝 */
}


name{
  font-size: 5rem;
  margin-bottom: 1rem;
}
name:hover{
  color: rgb(255, 98, 0);
  font-weight: bold;
}

/* Logo */
.corner-logo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.corner-logo-wrapper {
  position: fixed;
  left: 6rem;
  bottom: 6.5rem;
  width: 280px;
  height: 280px;
  z-index: 20;
  background: radial-gradient(circle at center, rgba(255,255,255,0.3), transparent);
  border-radius: 50%;
}

/* Scroll Indicator */
.scroll-indicator {
  position: absolute;
  right: 5rem;
  bottom: 8rem;
  width: 160px;
  object-fit: contain;
  z-index: 20;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.3s ease;
  animation: floatUpDown 3s ease-in-out infinite;
}
.scroll-indicator.hide {
  opacity: 0;
  animation: none;
}
@keyframes floatUpDown {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Footer */
.footer-capsule {
  position: fixed;
  bottom: 3rem;
  left: 5rem;
  right: 5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.6rem 1.5rem;
  backdrop-filter: blur(12px);
  border-radius: 2rem;
  z-index: 15;
  background-color: #e1ddd8;
  font-family: Futura;
  font-size: 1.2rem;
}

.footer-text span.full { display: inline; }
.footer-text span.short { display: none; }

@media (max-width: 400px) {
  .footer-text span.full { display: none; }
  .footer-text span.short { display: inline; }
}

/* Menu */
.menu { display: flex; gap: 1.5rem; }
.menu a {
  font-family: LaborUnion;
  position: relative;
  color: #000000;
  text-decoration: none;
  font-size: 1.2rem;
  overflow: hidden;
}
.menu a:hover { color: #6b6767; }
.menu a::after {
  content:'';
  position: absolute;
  left: 0;
  bottom: 0;
  width:100%;
  height:3px;
  background-color:#6b6767;
  transform:scale(0,1);
  transform-origin:left;
  transition: 0.3s;
}
.menu a:hover:after{ transform:scale(1) }

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 5px;
}
.hamburger span {
  width: 25px;
  height: 3px;
  background: #fff;
  border-radius: 2px;
}

/* Dropdown */
.menu-dropdown {
  display: none;
  position: absolute;
  bottom: 3.5rem;
  background: rgba(40, 40, 40, 0.55);
  backdrop-filter: blur(12px);
  border-radius: 2rem;
  overflow: hidden;
  flex-direction: column;
  width: 180px;
  z-index: 30;
}
.menu-dropdown a {
  padding: 0.8rem;
  color: #000000;
  text-align: center;
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.menu-dropdown a:last-child { border-bottom: none; }
.menu-dropdown.show { display: flex; animation: fadeIn 0.3s ease; }



p {
  margin: 0;
  line-height: 1.5; /* 正常行高 */
}

p.half-line {
  height: 0.5em; /* 半行高度的空行 */
  margin: 0;
}


@media (max-width: 768px) {
  .menu { display: none; }
  .hamburger { display: flex; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Fonts */
@font-face {
  font-family: 'LaborUnion';
  src: url('https://shinyakira106.github.io/LaborUnion-Regular.ttf') format('truetype');
}
@font-face {
  font-family: 'Futura';
  src: url('https://shinyakira106.github.io/Futura-Medium.tff') format('truetype');
}
@font-face {
  font-family: 'Chinese';
  src: url('https://shinyakira106.github.io/LXGWWenKai-Bold.ttf') format('truetype');
}
</style>
</head>
<body>

<section class="hero">
  <a1>I am <name>ShinyAkira</name><br>
      a caustic & whimsical<br>
      observer and discussant.
  </a1>

  <div class="a2">
    <span class="a2-text">
      <br>also a 
      <a class="banner" target="_blank" href="https://genshin.hoyoverse.com/en/home/">Traveler</a>, 
      <a class="banner" target="_blank" href="https://hsr.hoyoverse.com/en-us/home/">Trailblazer</a>, 
      <a class="banner" target="_blank" href="https://zenless.hoyoverse.com/en-us/">Proxy</a>,
      <a class="banner" target="_blank" href="https://ak.hypergryph.com/">Doctor</a> & 
      <a class="banner" target="_blank" href="https://pjsekai.sega.jp/">Producer</a>,
      <br><del>Teck Otaku, Mostly</del>
    </span>
  </div>


  <img class="scroll-indicator" src="Scroll_button.png" alt="Scroll Down">
</section>

<div class="corner-logo-wrapper">
  <img class="corner-logo" src="Logo.png" alt="Logo">
</div>

<footer class="footer-capsule">
  <div class="footer-text">
    <span class="full">©️2025 ShinyAkira. All rights reserved.</span>
    <span class="short">©️2025 ShinyAkira</span>
  </div>

  <nav class="menu">
    <a href="#intro">Introduction</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#babble">Babble</a>
  </nav>

  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>

  <div class="menu-dropdown" id="menuDropdown">
    <a href="#intro">Introduction</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#babble">Babble</a>
  </div>
</footer>

<script>
const a2Text = document.querySelector('.a2-text');
const originalHTML = a2Text.innerHTML;
let timeoutId;

const scrollHTML = `
    <span class="a2-scroll-text">
      <br>I am fascinated with <i><u>tech, anime, rail and design</u></i><br>
      and recently engaged in relevant research.<br>
      
      <p class="half-line"></p>
      I start my new life <a target="_blank" href="https://en.wikipedia.org/wiki/Brisbane" class="canner">here</a> nowadays, far away from my <a target="_blank" href="https://en.wikipedia.org/wiki/Nanjing" class="canner">home</a>.<br>
      And I learned how to behave <a target="blank" href="https://en.wikipedia.org/wiki/Jiujiang" class="canner">there</a> in a very young age.<br>
      Apart from <a target="blank" href="https://www.bilibili.com/" class="canner">here</a>, I deepen my insights in a place called society.<br>
      
      <p class="half-line"></p>
      When you have spare time, you can find me <a target="blank" href="https://twitter.com/shinyakira106" class="canner">there</a>.<br>
      And I babble <i><u><a href="https://shinyakira106.github.io/babble/" class="canner"><font color="#1066b7">here</font></a></u></i> some of the times.<br>
    <\span>
  `;

const showScrollMessage = () => {
  if (timeoutId) clearTimeout(timeoutId);

  a2Text.classList.add('fade-out');
  setTimeout(() => {
    a2Text.innerHTML = scrollHTML;
    a2Text.classList.remove('fade-out');
  }, 500);

  timeoutId = setTimeout(() => {
    a2Text.classList.add('fade-out');
    setTimeout(() => {
      a2Text.innerHTML = originalHTML;
      a2Text.classList.remove('fade-out');
    }, 500);
  }, 5000);
};

// 使用 wheel / touchmove 事件
window.addEventListener('wheel', showScrollMessage);
window.addEventListener('touchmove', showScrollMessage);


// Hamburger
const hamburger = document.getElementById('hamburger');
const menuDropdown = document.getElementById('menuDropdown');
hamburger.addEventListener('click', () => menuDropdown.classList.toggle('show'));

// Scroll Indicator
const scrollIndicator = document.querySelector('.scroll-indicator');
let hideTimeout;
const hideIndicator = () => {
  scrollIndicator.classList.add('hide');
};
const showIndicator = () => {
  scrollIndicator.classList.remove('hide');
  clearTimeout(hideTimeout);
  hideTimeout = setTimeout(hideIndicator, 3000);
};
hideTimeout = setTimeout(hideIndicator, 3000);
window.addEventListener('wheel', showIndicator);
window.addEventListener('touchmove', showIndicator);
</script>

</body>
</html>
